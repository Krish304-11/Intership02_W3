<!DOCTYPE html>
<html>

<head>
    <title>Change Button Color</title>

    <style>
        button {
            background-color: blue;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h2>Change Button Color</h2>

    <button onclick="changeColor()">Click Me</button>

    <script>
        function changeColor() {
            document.querySelector("button").style.backgroundColor = "red";
        }
    </script>

</body>

</html>
